<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worm Arena</title>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      overflow: hidden;
      background: #0a0a12;
      color: #ecf6ff;
      font-family: system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
    }

    #menu {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(ellipse at 50% 30%, #183859e8, #050711f5 75%);
    }

    .card {
      width: min(100%, 360px);
      padding: 28px;
      border: 1px solid #355273;
      border-radius: 24px;
      background: #0e1728;
      text-align: center;
    }

    h1 { margin: 0 0 24px; }
    h1 span { color: #65ccff; }

    label {
      display: block;
      margin-bottom: 6px;
      text-align: left;
    }

    input, button {
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid #355273;
      border-radius: 10px;
      background: #17263c;
      color: inherit;
      font: inherit;
    }

    .card input, .card button { width: 100%; }

    button {
      margin-top: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    #play {
      background: #65ccff;
      color: #081526;
    }

    #controls { color: #b8cce3; }

    #menu-button {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      margin: 0;
    }
  </style>
</head>

<body>
  <canvas id="arena" aria-label="Игровая арена"></canvas>

  <button id="menu-button" type="button" aria-label="Открыть меню" hidden>☰</button>

  <div id="menu">
    <form class="card" id="game-form">
      <h1>WORM <span>ARENA</span></h1>

      <label for="nickname">Ник игрока</label>
      <input id="nickname" maxlength="20" value="Kyusora" autocomplete="off">

      <button id="play" type="submit">Играть</button>
      <button id="help" type="button" aria-controls="controls" aria-expanded="false">
        Управление
      </button>

      <p id="controls" hidden>
        Веди игрока курсором или пальцем. Удерживай пробел для ускорения.
        Открой меню клавишей Esc или кнопкой ☰.
      </p>
    </form>
  </div>

  <script>
    const canvas = document.getElementById("arena");
    const ctx = canvas.getContext("2d");
    const menu = document.getElementById("menu");
    const menuButton = document.getElementById("menu-button");
    const form = document.getElementById("game-form");
    const playButton = document.getElementById("play");
    const nickname = document.getElementById("nickname");
    const helpButton = document.getElementById("help");
    const controls = document.getElementById("controls");

    const world = { radius: 430 };
    const player = { x: 0, y: 0, angle: 0, radius: 18, name: "Kyusora" };
    const pointer = { x: 0, y: 0, active: false };

    let started = false;
    let boosting = false;
    let previousTime = 0;

    function resize() {
      // Размер холста подстраивается под окно браузера.
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      pointer.active = false;
    }

    function startGame(event) {
      event.preventDefault();

      // Берём ник из поля меню. Пустой ник заменяем на «Игрок».
      player.name = nickname.value.trim() || "Игрок";
      started = true;
      menu.hidden = true;
      menuButton.hidden = false;
      playButton.textContent = "Продолжить";
      menuButton.focus();
    }

    function openMenu() {
      menu.hidden = false;
      menuButton.hidden = true;
      boosting = false;
      pointer.active = false;
      playButton.focus();
    }

    function update(seconds) {
      if (!menu.hidden || !pointer.active) return;

      const dx = pointer.x - player.x;
      const dy = pointer.y - player.y;
      const distance = Math.hypot(dx, dy);
f (distance < 2) return;

      // atan2 вычисляет угол поворота к курсору или пальцу.
      player.angle = Math.atan2(dy, dx);

      const speed = boosting ? 360 : 210;
      const step = Math.min(speed * seconds, distance);
      player.x += Math.cos(player.angle) * step;
      player.y += Math.sin(player.angle) * step;

      // Удерживаем круг игрока внутри круглой арены.
      const limit = world.radius - player.radius;
      const fromCenter = Math.hypot(player.x, player.y);
      if (fromCenter > limit) {
        player.x *= limit / fromCenter;
        player.y *= limit / fromCenter;
      }
    }

    function arenaScale() {
      return Math.min(canvas.width, canvas.height) / (world.radius * 2 + 56);
    }

    function draw(time) {
      const seconds = previousTime ? Math.min((time - previousTime) / 1000, 0.05) : 0;
      previousTime = time;
      update(seconds);

      ctx.fillStyle = "#0a0a12";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      const scale = arenaScale();
      ctx.scale(scale, scale);

      // Арена.
      ctx.beginPath();
      ctx.arc(0, 0, world.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#141428";
      ctx.fill();
      ctx.strokeStyle = "#355273";
      ctx.lineWidth = 6;
      ctx.stroke();

      // Тело игрока. При ускорении оно становится светлее.
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = boosting ? "#8cf" : "#4af";
      ctx.fill();
      ctx.strokeStyle = "#cff";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Нос показывает направление. 26 — длина линии от центра тела.
      const noseLength = 26;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(
        player.x + Math.cos(player.angle) * noseLength,
        player.y + Math.sin(player.angle) * noseLength
      );
      ctx.lineWidth = 3;
      ctx.stroke();

      // Рисуем ник над игроком. Чем больше отступ, тем выше текст.
      ctx.fillStyle = "#eee";
      ctx.font = "20px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(player.name, player.x, player.y - 30);

      ctx.restore();
      requestAnimationFrame(draw);
    }

    function aim(event) {
      const bounds = canvas.getBoundingClientRect();
      const scale = arenaScale();

      pointer.x = (event.clientX - bounds.left - canvas.width / 2) / scale;
      pointer.y = (event.clientY - bounds.top - canvas.height / 2) / scale;
      pointer.active = true;
    }

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      aim(event);
    });
    canvas.addEventListener("pointermove", aim);
    canvas.addEventListener("pointercancel", () => {
      pointer.active = false;
    });

    form.addEventListener("submit", startGame);
    menuButton.addEventListener("click", openMenu);

    helpButton.addEventListener("click", () => {
      controls.hidden = !controls.hidden;
      helpButton.setAttribute("aria-expanded", String(!controls.hidden));
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && started && !event.repeat) {
        if (menu.hidden) openMenu();
        else form.requestSubmit();
      }

      if (event.code === "Space" && menu.hidden && event.target !== menuButton) {
        event.preventDefault();
        boosting = true;
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.code === "Space") boosting = false;
    });

    window.addEventListener("blur", () => {
      boosting = false;
      pointer.active = false;
    });

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
